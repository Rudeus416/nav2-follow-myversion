# 【内容标注】用途：Nav2 规划器、控制器与代价地图参数。
# 对应用户需求：R01 R13 R14 R19 R22（原话及追溯边界见 nav2/CODE_GUIDE.md）。
# 添加/修改逻辑：配置自有整车规划/评价插件、车身轮廓、速度/进展检查和障碍图层。
# 本次仅加注释；需求关联不是精确创建/提交记录。
# ROS 2 Humble. Measure footprint and radar->base_link TF before enabling.
# 【参数分区】行为树与动作依赖；对应 R13/R14，执行限速相关见 R19。
bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node
# 【参数分区】路径跟踪、进展检查、速度与整车轨迹评价；对应 R13/R14，执行限速相关见 R19。
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      # Count measured rotation as progress during low-speed turnarounds.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.15  # radians, about 8.6 degrees
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.7  # ~40 degrees, final heading only
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.18
      max_vel_y: 0.0
      max_vel_theta: 0.4
      min_speed_xy: 0.0
      max_speed_xy: 0.18
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.8
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      critics: [WholeBody, RotateToGoal, Oscillation, PathAlign, PathDist, GoalDist]
      WholeBody.class: visual_car_nav2::WholeBodyCritic
      WholeBody.scale: 1.0
      PathAlign.scale: 12.0  # softer path alignment; collision checks unchanged
      PathAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
# 【参数分区】自有整车全局规划搜索参数；对应 R13/R14，执行限速相关见 R19。
planner_server:
  ros__parameters:
    expected_planner_frequency: 0.0  # on-demand planning, no periodic rate expected
    planner_plugins: [GridBased]
    GridBased:
      # Project-local SE(2) search: filled footprint AND swept turns are checked.
      plugin: visual_car_nav2::Planner
      minimum_turning_radius: 0.4  # provisional; validate on chassis
      max_planning_time: 3.0
# 【参数分区】局部障碍、车身与紫色缓冲；对应 R13/R14，执行限速相关见 R19。
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.2
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      # User-specified length 0.494 m, width 0.364 m; base_link at rectangle center.
      footprint: '[[0.247,0.182],[0.247,-0.182],[-0.247,-0.182],[-0.247,0.182]]'
      footprint_padding: 0.05
      track_unknown_space: false
      plugins: [obstacles, inflation]
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        max_obstacle_height: 1000000.0
        enabled: true
        observation_sources: radar
        radar:
          topic: /ti_mmwave/radar_scan_pcl
          # Existing ti_mmwave_point_node frame, not raw ADC frame "radar".
          sensor_frame: ti_mmwave_0
          data_type: PointCloud2
          marking: true
          clearing: true
          observation_persistence: 0.0
          # Existing follow profile: 200 ms period; allow three periods.
          expected_update_rate: 0.6
          # Height filtering relaxed for planar commissioning (not measured bounds).
          min_obstacle_height: -1000000.0
          max_obstacle_height: 1000000.0
          obstacle_min_range: 0.15
          obstacle_max_range: 5.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
      # Purple cells are hard forbidden to the entire padded footprint.
      inflation:
        plugin: visual_car_nav2::HardBuffer
        enabled: true
        inflation_radius: 0.0
# 【参数分区】全局规划障碍、车身与紫色缓冲；对应 R13/R14，执行限速相关见 R19。
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.2
      rolling_window: true
      # 雷达模式保持此窗口；map/both 启动时按真实地图扩大全局范围
      # （当前 corridor 为 18×10m），并发布完整全局快照；局部窗口不变。
      width: 10
      height: 10
      resolution: 0.05
      # User-specified length 0.494 m, width 0.364 m; base_link at rectangle center.
      footprint: '[[0.247,0.182],[0.247,-0.182],[-0.247,-0.182],[-0.247,0.182]]'
      footprint_padding: 0.05
      track_unknown_space: false
      plugins: [obstacles, inflation]
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        max_obstacle_height: 1000000.0
        enabled: true
        observation_sources: radar
        radar:
          topic: /ti_mmwave/radar_scan_pcl
          # Existing ti_mmwave_point_node frame, not raw ADC frame "radar".
          sensor_frame: ti_mmwave_0
          data_type: PointCloud2
          marking: true
          clearing: true
          observation_persistence: 0.0
          # Existing follow profile: 200 ms period; allow three periods.
          expected_update_rate: 0.6
          # Height filtering relaxed for planar commissioning (not measured bounds).
          min_obstacle_height: -1000000.0
          max_obstacle_height: 1000000.0
          obstacle_min_range: 0.15
          obstacle_max_range: 5.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
      # Purple cells are hard forbidden to the entire padded footprint.
      inflation:
        plugin: visual_car_nav2::HardBuffer
        enabled: true
        inflation_radius: 0.0
